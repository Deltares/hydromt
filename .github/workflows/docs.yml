---
name: Build Documentation
on:
  workflow_dispatch:
  push:
    branches: [main, release/**]
    paths:
      - hydromt/**
      - data/**
      - docs/**
      - examples/**
      - pyproject.toml
      - .github/workflows/docs.yml
  pull_request:
    branches: [main, release/**]
    paths:
      - hydromt/**
      - data/**
      - docs/**
      - examples/**
      - pyproject.toml
      - .github/workflows/docs.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash -e -l {0}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: "v0.76.0"

  build-docs:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: docs-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # if we're not publishing we don't have to write them, so we might as well
      # save ourself a bunch of IO time
      - name: Generate dummy docs
        if: ${{ github.event_name == 'pull_request' }}
        run: pixi run --locked sphinx-build ./docs ./docs/_build -b dummy -W

      - name: Generate docs
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          pixi run --locked docs
          export CURRENT_VERSION=$(grep "^__version__" hydromt/__init__.py | cut -d= -f 2 | tr -d "\" ")

          if [ -z "$CURRENT_VERSION" ]; then
            echo "ERROR Could not determine version, exiting..."
            exit 1
          fi

          # Docs built from main are the dev docs docs, published as "latest".
          # Anything else (a release branch) is published under
          # its own vX.Y.Z folder. Releases are always made from
          # release branches, so if main, then latest.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DOC_VERSION=latest" >> "$GITHUB_ENV"
          elif echo "$CURRENT_VERSION" | grep -q "dev"; then
            echo "ERROR: Failed to determine version since it"
            echo "       contains 'dev' but is not made from main."
            echo "       version: $CURRENT_VERSION", branch: ${{ github.ref }}
            exit 1
          else
            echo "DOC_VERSION=v$CURRENT_VERSION" >> "$GITHUB_ENV"
          fi
          echo "Found version: $DOC_VERSION"

  publish-docs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: gh-pages-write
      cancel-in-progress: false
    steps:
    - name: Upload to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        exclude_assets: .buildinfo,_sources/*,_examples/*.ipynb
        destination_dir: ./${{ env.DOC_VERSION }}
        keep_files: false
        full_commit_message: Deploy ${{ env.DOC_VERSION }} to GitHub Pages
