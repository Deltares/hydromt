name: SonarQube Scan and coverage

on:
  workflow_dispatch:
  push:
    branches: [main, release/**]
    paths:
      - tests/**/*
      - hydromt/**/*
      - data/**/*
      - pyproject.toml
      - pixi.lock
      - .github/workflows/sonar.yml
      - sonar-project.properties
  pull_request:
    branches: [main, release/**]
    paths:
      - tests/**/*
      - hydromt/**/*
      - data/**/*
      - pyproject.toml
      - pixi.lock
      - .github/workflows/sonar.yml
      - sonar-project.properties
  workflow_run:
    workflows: [Pixi auto update]
    types:
      - completed

defaults:
  run:
    shell: bash -e -l {0}

jobs:
  scan:
    name: run test coverage and SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: "v0.76.0"
      - name: Create aws profile for minio access
        env:
          ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY_READONLY_HYDROMT_DATA }}
          SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY_READONLY_HYDROMT_DATA }}
        run: |
          mkdir -p ~/.aws
          pixi run aws configure set aws_access_key_id     "$ACCESS_KEY" --profile hydromt-data
          pixi run aws configure set aws_secret_access_key "$SECRET_KEY" --profile hydromt-data
          pixi run aws configure set region eu-west-1 --profile hydromt-data
          pixi run aws configure set endpoint_url https://s3.deltares.nl --profile hydromt-data
      - name: Test
        run: pixi run --locked test-cov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN_2025 }}
